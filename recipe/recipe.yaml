schema_version: 1

context:
  version: "0.2.0"

package:
  name: doiggie
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/doiggie/doiggie-${{ version }}.tar.gz
  sha256: 7b90d708a53283e37bc8f652bf2ba14e1a9ee0ce581aaf8b8c1d33c6fe1914be

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - setuptools-scm >=7
    - pip
  run:
    - python >=${{ python_min }}
    - pooch
    - requests

tests:
  - python:
      imports:
        - doiggie
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Enable pooch to work with DOIs
  license: BSD-2-Clause
  license_file:
    - LICENSE.md
    - COPYING.md
  homepage: https://github.com/ssciwr/doiggie
  repository: https://github.com/ssciwr/doiggie

extra:
  recipe-maintainers:
    - dokempf
